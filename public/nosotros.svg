<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" role="img" aria-label="Taller Mazzelli">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A87B55"/>
      <stop offset="55%" stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#6B4A33"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A87B55"/>
      <stop offset="100%" stop-color="#6B4A33"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8CA8A"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8E6A22"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.28" cy="0.22" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="675" fill="url(#fondo)"/>
  <rect width="900" height="675" fill="url(#luz)"/>

  <!-- textura de grano -->
  <g opacity="0.14" fill="#ffffff">
    <circle cx="0" cy="0" r="1"/>
    <circle cx="97" cy="53" r="2"/>
    <circle cx="194" cy="106" r="3"/>
    <circle cx="291" cy="159" r="1"/>
    <circle cx="388" cy="212" r="2"/>
    <circle cx="485" cy="265" r="3"/>
    <circle cx="582" cy="318" r="1"/>
    <circle cx="679" cy="371" r="2"/>
    <circle cx="776" cy="424" r="3"/>
    <circle cx="873" cy="477" r="1"/>
    <circle cx="70" cy="530" r="2"/>
    <circle cx="167" cy="583" r="3"/>
    <circle cx="264" cy="636" r="1"/>
    <circle cx="361" cy="14" r="2"/>
    <circle cx="458" cy="67" r="3"/>
    <circle cx="555" cy="120" r="1"/>
    <circle cx="652" cy="173" r="2"/>
    <circle cx="749" cy="226" r="3"/>
    <circle cx="846" cy="279" r="1"/>
    <circle cx="43" cy="332" r="2"/>
    <circle cx="140" cy="385" r="3"/>
    <circle cx="237" cy="438" r="1"/>
    <circle cx="334" cy="491" r="2"/>
    <circle cx="431" cy="544" r="3"/>
    <circle cx="528" cy="597" r="1"/>
    <circle cx="625" cy="650" r="2"/>
