<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Mochila Urbana">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A4A40"/>
      <stop offset="55%" stop-color="#3A2F29"/>
      <stop offset="100%" stop-color="#241812"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A4A40"/>
      <stop offset="100%" stop-color="#241812"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8CA8A"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8E6A22"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.28" cy="0.22" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#fondo)"/>
  <rect width="800" height="600" fill="url(#luz)"/>

  <!-- textura de grano -->
  <g opacity="0.14" fill="#ffffff">
    <circle cx="0" cy="0" r="1"/>
    <circle cx="97" cy="53" r="2"/>
    <circle cx="194" cy="106" r="3"/>
    <circle cx="291" cy="159" r="1"/>
    <circle cx="388" cy="212" r="2"/>
    <circle cx="485" cy="265" r="3"/>
    <circle cx="582" cy="318" r="1"/>
    <circle cx="679" cy="371" r="2"/>
    <circle cx="776" cy="424" r="3"/>
    <circle cx="73" cy="477" r="1"/>
    <circle cx="170" cy="530" r="2"/>
    <circle cx="267" cy="583" r="3"/>
    <circle cx="364" cy="36" r="1"/>
    <circle cx="461" cy="89" r="2"/>
    <circle cx="558" cy="142" r="3"/>
    <circle cx="655" cy="195" r="1"/>
    <circle cx="752" cy="248" r="2"/>
    <circle cx="49" cy="301" r="3"/>
    <circle cx="146" cy="354" r="1"/>
    <circle cx="243" cy="407" r="2"/>
    <circle cx="340" cy="460" r="3"/>
    <circle cx="437" cy="513" r="1"/>
    <circle cx="534" cy="566" r="2"/>
    <circle cx="631" cy="19" r="3"/>
    <circle cx="728" cy="72" r="1"/>
    <circle cx="25" cy="125" r="2"/>
