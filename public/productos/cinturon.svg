<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Cinturón "Nilo"">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A87B55"/>
      <stop offset="55%" stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#6B4A33"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A87B55"/>
      <stop offset="100%" stop-color="#6B4A33"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8CA8A"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8E6A22"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.28" cy="0.22" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#fondo)"/>
  <rect width="800" height="600" fill="url(#luz)"/>

  <!-- textura de grano -->
  <g opacity="0.14" fill="#ffffff">
    <circle cx="0" cy="0" r="1"/>
    <circle cx="97" cy="53" r="2"/>
    <circle cx="194" cy="106" r="3"/>
    <circle cx="291" cy="159" r="1"/>
    <circle cx="388" cy="212" r="2"/>
    <circle cx="485" cy="265" r="3"/>
    <circle cx="582" cy="318" r="1"/>
    <circle cx="679" cy="371" r="2"/>
    <circle cx="776" cy="424" r="3"/>
    <circle cx="73" cy="477" r="1"/>
    <circle cx="170" cy="530" r="2"/>
    <circle cx="267" cy="583" r="3"/>
    <circle cx="364" cy="36" r="1"/>
    <circle cx="461" cy="89" r="2"/>
    <circle cx="558" cy="142" r="3"/>
    <circle cx="655" cy="195" r="1"/>
    <circle cx="752" cy="248" r="2"/>
    <circle cx="49" cy="301" r="3"/>
    <circle cx="146" cy="354" r="1"/>
    <circle cx="243" cy="407" r="2"/>
    <circle cx="340" cy="460" r="3"/>
    <circle cx="437" cy="513" r="1"/>
    <circle cx="534" cy="566" r="2"/>
    <circle cx="631" cy="19" r="3"/>
    <circle cx="728" cy="72" r="1"/>
    <circle cx="25" cy="125" r="2"/>
  </g>

  <!-- marco con costura punteada -->
  <rect x="26" y="26" width="748" height="548" rx="18"
        fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3"
        stroke-dasharray="10 9" stroke-linecap="round"/>

  <!-- sombra de la pieza -->
  <ellipse cx="400" cy="492" rx="180" ry="22" fill="rgba(0,0,0,.22)"/>

  
    <rect x="230" y="280" width="340" height="46" rx="12" fill="url(#cuerpo)" stroke="rgba(255,255,255,.3)" stroke-width="3"/>
    <rect x="300" y="268" width="86" height="70" rx="12" fill="none" stroke="url(#metal)" stroke-width="12"/>
    <rect x="312" y="292" width="62" height="22" rx="8" fill="url(#metal)" opacity=".85"/>
    <g fill="rgba(0,0,0,.28)">
      <circle cx="440" cy="303" r="6"/><circle cx="470" cy="303" r="6"/>
      <circle cx="500" cy="303" r="6"/><circle cx="530" cy="303" r="6"/>
    </g>

  <!-- textos -->
  <text x="56" y="526" font-family="Georgia, 'Playfair Display', serif"
        font-size="26" font-weight="700" fill="rgba(255,255,255,.92)">Cinturón "Nilo"</text>
  <text x="56" y="552" font-family="Helvetica, Arial, sans-serif"
        font-size="14" letter-spacing="3" fill="rgba(255,255,255,.6)">Latón cepillado · 4 cm</text>
  <text x="744" y="552" text-anchor="end"
        font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4"
        fill="rgba(255,255,255,.5)">MAZZELLI · CUEROS PERÚ</text>
</svg>
