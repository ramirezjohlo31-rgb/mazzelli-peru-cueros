name: Tarea
description: Reporta un error o propone una mejora del sitio
labels: ["bug", "feature"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de reporte
      options:
        - Error
        - Mejora de contenido
        - Mejora de diseno
        - Mejora tecnica
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: Descripcion
      description: Que ocurre y que se esperaba que ocurriera
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL de la pagina
      placeholder: /productos/cartera-soy-lima

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
